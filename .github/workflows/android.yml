name: android-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 把根目录的壳文件归位到 mobile/
        run: |
          rm -rf mobile
          mkdir -p mobile
          cp package.json capacitor.config.json mobile/
          cp -r scripts android-patches mobile/

      - name: 构建并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mobile/scripts/ci.sh
